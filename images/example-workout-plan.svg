<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1000" viewBox="0 0 880 1000" role="img" aria-labelledby="title desc">
  <title id="title">Example: Claude builds a workout plan from WHOOP data, a calendar and research</title>
  <desc id="desc">The user asks Claude for next week's workout plan based on their WHOOP data, goals and calendar. Claude reads the calendar through Google Calendar, reads recovery, sleep and training load through whoop-mcp, searches the web for research, and answers with a day-by-day plan in which every line names its source: the calendar, WHOOP data or a cited study.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #18181b; }
    .muted { fill: #71717a; }
    .small { font-size: 13px; }
    .body { font-size: 15px; }
    .row { font-size: 14px; }
    .bold { font-weight: 600; }
    .h { font-size: 15px; font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #52525b; }
    .pill-cal rect { fill: #e8f0fe; }
    .pill-cal text { fill: #1d4ed8; font-size: 12px; font-weight: 600; }
    .pill-whoop rect { fill: #e6f4ea; }
    .pill-whoop text { fill: #15803d; font-size: 12px; font-weight: 600; }
    .pill-ref rect { fill: #f3e8ff; }
    .pill-ref text { fill: #7e22ce; font-size: 12px; font-weight: 600; }
    .icon { fill: none; stroke: #52525b; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Card -->
  <rect x="0.5" y="0.5" width="879" height="999" rx="16" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="32" y="38" class="small muted">Example conversation in Claude with three connectors switched on</text>

  <!-- User message -->
  <rect x="236" y="58" width="612" height="96" rx="14" fill="#f4f4f5"/>
  <text x="256" y="88" class="body">Based on my WHOOP data, my goals and my calendar, build me a</text>
  <text x="256" y="111" class="body">workout plan for next week. I want to run 10 km in under 50 minutes</text>
  <text x="256" y="134" class="body">by March and keep lifting twice a week.</text>

  <!-- What Claude used -->
  <rect x="32" y="176" width="816" height="174" rx="12" fill="#fafafa" stroke="#e4e4e7"/>
  <text x="52" y="202" class="small muted">Claude used</text>

  <!-- Google Calendar -->
  <rect x="52" y="216" width="32" height="32" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
  <g class="icon" transform="translate(59 223)">
    <rect x="0" y="2" width="18" height="16" rx="3"/>
    <line x1="0" y1="7" x2="18" y2="7"/>
    <line x1="5" y1="0" x2="5" y2="4"/>
    <line x1="13" y1="0" x2="13" y2="4"/>
  </g>
  <text x="98" y="230" class="row bold">Google Calendar</text>
  <text x="98" y="248" class="small muted">Read your events for Monday to Sunday next week</text>

  <!-- WHOOP -->
  <rect x="52" y="262" width="32" height="32" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
  <g class="icon" transform="translate(58 270)">
    <polyline points="0,8 5,8 8,2 12,15 15,8 20,8"/>
  </g>
  <text x="98" y="276" class="row bold">WHOOP (whoop-mcp)</text>
  <text x="98" y="294" class="mono">get_baselines · get_sleep_analysis · get_training_load · get_workout_log</text>

  <!-- Web search -->
  <rect x="52" y="308" width="32" height="32" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
  <g class="icon" transform="translate(59 315)">
    <circle cx="7.5" cy="7.5" r="6"/>
    <line x1="12" y1="12" x2="17" y2="17"/>
  </g>
  <text x="98" y="322" class="row bold">Web search</text>
  <text x="98" y="340" class="small muted">HRV-guided training · strength and endurance in the same week · sleep and performance</text>

  <!-- Answer -->
  <text x="32" y="390" class="body">Here's a week that fits around your meetings and how you've been recovering.</text>

  <text x="32" y="428" class="h">What I used from your data</text>
  <text x="44" y="456" class="body">•  Recovery averaged 58% over the last 30 days; your HRV baseline is 61 ms.</text>
  <g class="pill-whoop"><rect x="766" y="441" width="82" height="22" rx="11"/><text x="807" y="456" text-anchor="middle">WHOOP</text></g>
  <text x="44" y="484" class="body">•  You slept 6 h 41 min a night, about 50 min less than WHOOP said you needed.</text>
  <g class="pill-whoop"><rect x="766" y="469" width="82" height="22" rx="11"/><text x="807" y="484" text-anchor="middle">WHOOP</text></g>
  <text x="44" y="512" class="body">•  Your training load over the last 7 days is 24% above your 4-week average.</text>
  <g class="pill-whoop"><rect x="766" y="497" width="82" height="22" rx="11"/><text x="807" y="512" text-anchor="middle">WHOOP</text></g>

  <text x="32" y="554" class="h">Plan</text>
  <line x1="32" y1="566" x2="848" y2="566" stroke="#f4f4f5"/>

  <text x="44" y="590" class="row bold">Mon</text>
  <text x="100" y="590" class="row">Strength A, 45 min</text>
  <text x="290" y="590" class="row muted">before work, you're free 7:00 to 8:00</text>
  <g class="pill-cal"><rect x="766" y="575" width="82" height="22" rx="11"/><text x="807" y="590" text-anchor="middle">Calendar</text></g>

  <text x="44" y="620" class="row bold">Tue</text>
  <text x="100" y="620" class="row">Easy run, 40 min</text>
  <text x="290" y="620" class="row muted">zone 2 by your own heart-rate zones</text>
  <g class="pill-whoop"><rect x="766" y="605" width="82" height="22" rx="11"/><text x="807" y="620" text-anchor="middle">WHOOP</text></g>

  <text x="44" y="650" class="row bold">Wed</text>
  <text x="100" y="650" class="row">Rest</text>
  <text x="290" y="650" class="row muted">meetings until 20:30</text>
  <g class="pill-cal"><rect x="766" y="635" width="82" height="22" rx="11"/><text x="807" y="650" text-anchor="middle">Calendar</text></g>

  <text x="44" y="680" class="row bold">Thu</text>
  <text x="100" y="680" class="row">Intervals, 5 × 1 km</text>
  <text x="290" y="680" class="row muted">only if recovery is 50% or more; otherwise 30 min easy</text>
  <g class="pill-ref"><rect x="766" y="665" width="82" height="22" rx="11"/><text x="807" y="680" text-anchor="middle">Study [1]</text></g>

  <text x="44" y="710" class="row bold">Fri</text>
  <text x="100" y="710" class="row">Strength B, 45 min</text>
  <text x="290" y="710" class="row muted">a day after the intervals, not the same day</text>
  <g class="pill-ref"><rect x="766" y="695" width="82" height="22" rx="11"/><text x="807" y="710" text-anchor="middle">Study [2]</text></g>

  <text x="44" y="740" class="row bold">Sat</text>
  <text x="100" y="740" class="row">Long run, 70 min</text>
  <text x="290" y="740" class="row muted">easy pace; nothing booked before 14:00</text>
  <g class="pill-cal"><rect x="766" y="725" width="82" height="22" rx="11"/><text x="807" y="740" text-anchor="middle">Calendar</text></g>

  <text x="44" y="770" class="row bold">Sun</text>
  <text x="100" y="770" class="row">Rest</text>
  <text x="290" y="770" class="row muted">lights out by 23:00 to make up some of the sleep you're missing</text>
  <g class="pill-ref"><rect x="766" y="755" width="82" height="22" rx="11"/><text x="807" y="770" text-anchor="middle">Study [3]</text></g>

  <text x="32" y="816" class="h">Why</text>
  <text x="32" y="842" class="row">[1] Planning hard days around morning HRV raised maximal running speed more than a fixed plan (Kiviniemi et al., 2007).</text>
  <text x="32" y="866" class="row">[2] Hard endurance work close to strength sessions can blunt strength gains; the review discusses spacing</text>
  <text x="55" y="886" class="row">them apart (Fyfe et al., 2014).</text>
  <text x="32" y="910" class="row">[3] Sleeping longer improved sprint times and shooting accuracy in college basketball players (Mah et al., 2011).</text>

  <line x1="32" y1="934" x2="848" y2="934" stroke="#e4e4e7"/>
  <text x="32" y="958" class="small muted">Sources: Eur J Appl Physiol 101:743–751 (2007) · Sports Med 44:743–762 (2014) · Sleep 34:943–950 (2011)</text>
  <text x="32" y="980" class="small muted">Illustration: the numbers and events are made up. The steps are what Claude does with these connectors.</text>
</svg>
